<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Reviews</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: transparent;
    overflow: hidden;
  }

  .reviews-widget {
    width: 100%;
    margin: 0 auto;
    padding: 12px 0 0 0;
    overflow: hidden;
    position: relative;
  }

  /* ── Carousel Track ── */
  .carousel-row {
    display: flex;
    width: max-content;
    gap: 20px;
    padding: 10px 0;
  }

  .row-1 { animation: scrollLeft 120s linear infinite; }
  .row-2 { animation: scrollRight 130s linear infinite; margin-top: 10px; }

  .carousel-row:hover { animation-play-state: paused; }

  @keyframes scrollLeft {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  @keyframes scrollRight {
    0%   { transform: translateX(-50%); }
    100% { transform: translateX(0); }
  }

  /* ── Review Card ── */
  .review-card {
    flex-shrink: 0;
    width: 360px;
    background: #ffffff;
    border: 1px solid rgba(34, 96, 51, 0.08);
    border-radius: 16px;
    padding: 26px 28px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
    transition: box-shadow 0.3s ease, transform 0.3s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .review-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #226033, #22A033);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .review-card:hover {
    box-shadow: 0 8px 30px rgba(34, 96, 51, 0.12), 0 2px 8px rgba(0, 0, 0, 0.06);
    transform: translateY(-2px);
  }

  .review-card:hover::before { opacity: 1; }

  /* Card Top */
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .stars { display: flex; gap: 3px; }
  .star-icon { width: 18px; height: 18px; }
  .star-filled { color: #D4A017; }
  .star-empty  { color: #ddd; }
  .google-icon { width: 22px; height: 22px; opacity: 0.6; }

  /* Review Text */
  .review-text {
    font-size: 14px;
    line-height: 1.65;
    color: #333;
    margin-bottom: 18px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    min-height: 92px;
  }

  .read-more-hint {
    font-size: 12px;
    color: #22A033;
    font-weight: 500;
    margin-top: -12px;
    margin-bottom: 14px;
  }

  /* Reviewer Info */
  .reviewer-info {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 14px;
    border-top: 1px solid rgba(34, 96, 51, 0.07);
  }

  .reviewer-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #226033, #22A033);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    flex-shrink: 0;
    user-select: none;
  }

  .reviewer-details { display: flex; flex-direction: column; }

  .reviewer-name {
    font-size: 13.5px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .review-date {
    font-size: 11.5px;
    color: #999;
    margin-top: 2px;
  }

  /* ── Review Count Footer ── */
  .review-count-footer {
    text-align: center;
    padding: 18px 0 8px;
    font-size: 13px;
    color: #d9d9d9;
    letter-spacing: 0.2px;
  }

  .review-count-footer svg {
    width: 14px;
    height: 14px;
    vertical-align: -2px;
    margin-right: 4px;
  }

  .review-count-number {
    font-weight: 600;
    color: #FFFFFF;
  }

  /* ── Empty State ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #999;
    font-size: 14px;
    display: none;
  }

  /* ── Modal Overlay ── */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }

  .modal-overlay.active {
    display: flex;
    opacity: 1;
  }

  .modal-card {
    background: #fff;
    border-radius: 20px;
    max-width: 520px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 36px;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.2);
    position: relative;
    transform: translateY(10px);
    transition: transform 0.25s ease;
  }

  .modal-overlay.active .modal-card { transform: translateY(0); }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: #f3f3f3;
    color: #666;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }

  .modal-close:hover { background: #e5e5e5; color: #333; }
  .modal-stars { display: flex; gap: 3px; margin-bottom: 6px; }
  .modal-stars .star-icon { width: 22px; height: 22px; }
  .modal-date { font-size: 12px; color: #999; margin-bottom: 20px; }

  .modal-text {
    font-size: 15px;
    line-height: 1.75;
    color: #333;
    margin-bottom: 24px;
    white-space: pre-wrap;
  }

  .modal-reviewer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 18px;
    border-top: 1px solid rgba(34, 96, 51, 0.07);
  }

  .modal-reviewer .reviewer-avatar {
    width: 44px; height: 44px;
    font-size: 18px;
  }

  .modal-reviewer .reviewer-name { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .modal-reviewer .review-date { font-size: 12px; color: #999; }

  .modal-google-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #999;
    margin-top: 16px;
  }

  .modal-google-badge svg { width: 16px; height: 16px; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .review-card { width: 290px; padding: 20px; }
    .reviews-widget { padding: 8px 0 0 0; }
    .carousel-row { gap: 14px; }
    .modal-card { padding: 24px; margin: 10px; }
  }

    CACHED_DATA.reviews.sort(function(a, b) { return reviewTimestamp(b) - reviewTimestamp(a); });
    renderCarousel(CACHED_DATA.reviews);
  } else {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('carouselContainer').style.display = 'none';
  }

})();
</script>

</body>
</html>
